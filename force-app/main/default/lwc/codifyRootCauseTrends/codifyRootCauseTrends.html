<template>
  <lightning-card title="Root Cause Trends" icon-name="standard:topic">
    <div slot="actions">
      <lightning-combobox
        label="Window"
        variant="label-hidden"
        value={daysBack}
        options={windowOptions}
        onchange={handleWindow}
      ></lightning-combobox>
    </div>

    <div class="slds-p-horizontal_medium slds-p-bottom_small">
      <p class={gapClass}>{gapLabel}</p>
    </div>

    <template if:true={error}>
      <div class="slds-p-horizontal_medium slds-text-color_error" role="alert">
        {error}
      </div>
    </template>

    <template if:true={hasRows}>
      <div class="slds-p-horizontal_x-small codify-trends-table">
        <lightning-datatable
          key-field="rootCause"
          data={rows}
          columns={columns}
          hide-checkbox-column
          column-widths-mode="auto"
        >
        </lightning-datatable>
      </div>
    </template>

    <template if:false={hasRows}>
      <div
        class="slds-p-around_large slds-align_absolute-center slds-text-color_weak"
      >
        No root causes tagged in this window yet.
      </div>
    </template>
  </lightning-card>
</template>
