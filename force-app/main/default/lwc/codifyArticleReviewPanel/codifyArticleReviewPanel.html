<template>
  <div class="codify-desk">
    <header class="codify-masthead">
      <div class="codify-masthead__copy">
        <p class="codify-masthead__eyebrow">Codify</p>
        <h1 class="codify-masthead__title">Pending article reviews</h1>
        <p class="codify-masthead__lede">
          Each draft next to the recap it came from. Check what Codify wrote
          against what the technician actually said.
        </p>
      </div>
      <div class="codify-masthead__aside">
        <c-codify-status-badge
          label={queueCountLabel}
          tone="pending"
          icon-name="utility:knowledge_base"
          assistive-prefix="Queue:"
        ></c-codify-status-badge>
      </div>
    </header>

    <template lwc:if={error}>
      <c-codify-error-state
        title="The review queue could not load"
        message={error.message}
        detail={error.detail}
        show-retry
        size="page"
        onretry={handleRetry}
      ></c-codify-error-state>
    </template>

    <template lwc:elseif={isLoading}>
      <div class="codify-review">
        <aside class="codify-card codify-card_queue">
          <c-codify-skeleton-loader
            variant="rows"
            count="5"
            height="3.5rem"
            assistive-text="Loading the review queue"
          ></c-codify-skeleton-loader>
        </aside>
        <section class="codify-card">
          <c-codify-skeleton-loader
            variant="lines"
            count="8"
            assistive-text="Loading the draft"
          ></c-codify-skeleton-loader>
        </section>
        <aside class="codify-card codify-card_source">
          <c-codify-skeleton-loader
            variant="lines"
            count="6"
            assistive-text="Loading the source recap"
          ></c-codify-skeleton-loader>
        </aside>
      </div>
    </template>

    <template lwc:elseif={hasArticles}>
      <!-- The draft's lifecycle. The fourth step is deliberately never reached
           here: publishing is a Knowledge action, operated by a person. -->
      <div class="codify-lifecycle">
        <lightning-progress-indicator
          type="base"
          current-step={lifecycleStep}
          variant="base"
        >
          <lightning-progress-step
            label="Recap captured"
            value="captured"
          ></lightning-progress-step>
          <lightning-progress-step
            label="Draft written by Codify"
            value="drafted"
          ></lightning-progress-step>
          <lightning-progress-step
            label="Your review"
            value="review"
          ></lightning-progress-step>
          <lightning-progress-step
            label="Published in Knowledge"
            value="published"
          ></lightning-progress-step>
        </lightning-progress-indicator>
        <p class="codify-lifecycle__note">
          Codify never completes the last step. Saving here keeps the article in
          Draft; publishing stays in Knowledge, with a person.
        </p>
      </div>

      <div class="codify-review">
        <!-- ── The queue ────────────────────────────────────────────────── -->
        <aside class="codify-card codify-card_queue">
          <c-codify-section-header
            eyebrow="Queue"
            title="Waiting on you"
            description={queueHeaderDescription}
          ></c-codify-section-header>

          <ul class="codify-queue">
            <template for:each={queue} for:item="draft">
              <li key={draft.id}>
                <button
                  class={draft.itemClass}
                  type="button"
                  aria-current={draft.ariaCurrent}
                  data-id={draft.id}
                  onclick={handleSelect}
                >
                  <span class="codify-queue__index" aria-hidden="true"
                    >{draft.position}</span
                  >
                  <span class="codify-queue__text">
                    <span class="codify-queue__title">{draft.title}</span>
                    <span class="codify-queue__meta">
                      <template lwc:if={draft.rootCause}>
                        <span>{draft.rootCause}</span>
                      </template>
                    </span>
                    <span class="codify-queue__meta">
                      <template lwc:if={draft.caseLabel}>
                        <span>{draft.caseLabel}</span>
                        <span aria-hidden="true">·</span>
                      </template>
                      <span>{draft.technicianLabel}</span>
                    </span>
                  </span>
                </button>
              </li>
            </template>
          </ul>
        </aside>

        <!-- ── The manuscript ──────────────────────────────────────────── -->
        <section class="codify-card codify-card_paper">
          <template lwc:if={selected}>
            <div class="codify-ms">
              <p class="codify-ms__stamp">{selectedPosition}</p>

              <template lwc:if={isReadMode}>
                <article class="codify-ms__paper">
                  <p class="codify-ms__kicker">Draft article</p>
                  <h2 class="codify-ms__title">{draftTitle}</h2>
                  <template lwc:if={hasSummary}>
                    <p class="codify-ms__lede">{draftSummary}</p>
                  </template>
                  <div class="codify-ms__body">
                    <lightning-formatted-rich-text
                      value={bodyForDisplay}
                    ></lightning-formatted-rich-text>
                  </div>
                </article>
              </template>

              <template lwc:else>
                <!-- Editing is a different surface on purpose: sans-serif, boxed
                     fields, obviously the reviewer's side of the desk. -->
                <div class="codify-editor">
                  <p class="codify-editor__kicker">Editing the draft</p>

                  <lightning-input
                    data-id="draft-title"
                    label="Article title"
                    value={draftTitle}
                    max-length={maxTitle}
                    message-when-value-missing="An article needs a title before it can be saved."
                    required
                    onchange={handleTitle}
                  ></lightning-input>
                  <template lwc:if={titleError}>
                    <p class="codify-editor__error" role="alert">
                      {titleError}
                    </p>
                  </template>
                  <p class="codify-editor__hint">{titleLengthLabel}</p>

                  <lightning-textarea
                    label="Summary"
                    value={draftSummary}
                    max-length={maxSummary}
                    field-level-help="One or two sentences a reader sees before opening the article."
                    onchange={handleSummary}
                  ></lightning-textarea>

                  <lightning-input-rich-text
                    label="Article body"
                    value={draftBody}
                    onchange={handleBody}
                  ></lightning-input-rich-text>
                </div>
              </template>
            </div>

            <!-- ── The reviewer's controls, kept off the paper ─────────── -->
            <footer class="codify-controls">
              <div class="codify-controls__state">
                <c-codify-status-badge
                  label={dirtyLabel}
                  tone={dirtyTone}
                  compact
                  assistive-prefix="Draft state:"
                ></c-codify-status-badge>
                <template lwc:if={savedNotice}>
                  <p class="codify-controls__saved" role="status">
                    {savedNotice}
                  </p>
                </template>
              </div>

              <div class="codify-controls__actions">
                <template lwc:if={isReadMode}>
                  <lightning-button
                    variant="brand"
                    label="Edit draft"
                    icon-name="utility:edit"
                    disabled={actionsDisabled}
                    onclick={handleEdit}
                  ></lightning-button>
                </template>

                <template lwc:else>
                  <div class="codify-action">
                    <lightning-button
                      variant="brand"
                      label={saveLabel}
                      icon-name="utility:save"
                      disabled={saveDisabled}
                      onclick={handleSave}
                    ></lightning-button>
                    <template lwc:if={isSaving}>
                      <span class="codify-action__spinner">
                        <lightning-spinner
                          size="x-small"
                          variant="brand"
                          alternative-text="Saving the draft"
                        ></lightning-spinner>
                      </span>
                    </template>
                  </div>
                  <lightning-button
                    variant="neutral"
                    label="Discard changes"
                    disabled={actionsDisabled}
                    onclick={handleCancelEdit}
                  ></lightning-button>
                </template>
              </div>

              <!-- Destructive, so it sits apart from Save and asks first -->
              <div class="codify-controls__danger">
                <lightning-button
                  variant="destructive-text"
                  label={rejectLabel}
                  icon-name="utility:delete"
                  disabled={actionsDisabled}
                  onclick={handleRejectRequest}
                ></lightning-button>
              </div>
            </footer>
          </template>

          <template lwc:else>
            <c-codify-empty-state
              icon-name="utility:knowledge_base"
              title="Pick a draft from the queue"
              message="Choose one of the drafts on the left to read it against the recap it came from."
            ></c-codify-empty-state>
          </template>
        </section>

        <!-- ── What the technician said ─────────────────────────────────── -->
        <aside class="codify-card codify-card_source">
          <c-codify-section-header
            eyebrow="Source"
            title="What the technician said"
            description="Verbatim, never rewritten. This is what the draft has to be true to."
          ></c-codify-section-header>

          <template lwc:if={selected}>
            <template lwc:if={hasRecap}>
              <blockquote class="codify-recap">
                {selected.originalRecap}
              </blockquote>
            </template>
            <template lwc:else>
              <p class="codify-source__none">
                No recap is linked to this draft, so there is nothing to compare
                it against. Treat the draft with more suspicion, not less.
              </p>
            </template>

            <dl class="codify-source__meta">
              <template lwc:if={selected.rootCause}>
                <div class="codify-source__pair">
                  <dt>Root cause</dt>
                  <dd>{selected.rootCause}</dd>
                </div>
              </template>
              <template lwc:if={selected.technicianName}>
                <div class="codify-source__pair">
                  <dt>Logged by</dt>
                  <dd>{selected.technicianName}</dd>
                </div>
              </template>
              <div class="codify-source__pair">
                <dt>Last modified</dt>
                <dd>
                  <lightning-formatted-date-time
                    value={selected.lastModified}
                    year="numeric"
                    month="short"
                    day="numeric"
                    hour="2-digit"
                    minute="2-digit"
                  ></lightning-formatted-date-time>
                </dd>
              </div>
            </dl>

            <div class="codify-source__links">
              <template lwc:if={selected.sourceCaseId}>
                <lightning-button
                  variant="base"
                  label="Open the Case"
                  icon-name="utility:open"
                  data-id={selected.sourceCaseId}
                  onclick={openRecord}
                ></lightning-button>
              </template>
              <template lwc:if={selected.sourceResolutionLogId}>
                <lightning-button
                  variant="base"
                  label="Open the recap record"
                  icon-name="utility:open"
                  data-id={selected.sourceResolutionLogId}
                  onclick={openRecord}
                ></lightning-button>
              </template>
            </div>
          </template>
        </aside>
      </div>
    </template>

    <template lwc:else>
      <c-codify-empty-state
        size="page"
        icon-name="utility:check"
        title="No drafts are waiting for review"
        message="Every article Codify has written has been actioned. New drafts appear here as technicians describe fixes worth writing up - and none of them goes live without a person."
      ></c-codify-empty-state>
    </template>

    <!-- ── Reject confirmation ──────────────────────────────────────────── -->
    <template lwc:if={showRejectDialog}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="codify-reject-heading"
        aria-describedby="codify-reject-body"
        class="slds-modal slds-fade-in-open slds-modal_small"
        onkeydown={handleDialogKeydown}
      >
        <div class="slds-modal__container">
          <header class="slds-modal__header codify-dialog__header">
            <h2 id="codify-reject-heading" class="codify-dialog__title">
              {rejectDialogTitle}
            </h2>
          </header>

          <div class="slds-modal__content codify-dialog__body">
            <p id="codify-reject-body" class="codify-dialog__copy">
              Rejecting deletes this draft. It was never live, so nothing
              published changes - and the resolution log keeps the recap, so the
              fix itself stays captured.
            </p>
            <lightning-textarea
              data-id="reject-reason"
              label="Why are you rejecting it?"
              placeholder="Duplicates an existing article…"
              value={rejectReason}
              field-level-help="Recorded on the audit trail, so a technician whose recaps keep producing rejected drafts is a visible pattern rather than a mystery."
              onchange={handleRejectReason}
            ></lightning-textarea>
          </div>

          <footer class="slds-modal__footer codify-dialog__footer">
            <lightning-button
              variant="neutral"
              label="Keep the draft"
              disabled={isRejecting}
              onclick={handleCancelReject}
            ></lightning-button>
            <div class="codify-action">
              <lightning-button
                variant="destructive"
                label={confirmRejectLabel}
                disabled={isRejecting}
                onclick={handleConfirmReject}
              ></lightning-button>
              <template lwc:if={isRejecting}>
                <span class="codify-action__spinner">
                  <lightning-spinner
                    size="x-small"
                    variant="brand"
                    alternative-text="Rejecting the draft"
                  ></lightning-spinner>
                </span>
              </template>
            </div>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </div>
</template>
