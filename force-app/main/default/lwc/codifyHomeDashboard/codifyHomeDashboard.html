<template>
  <div class="slds-grid slds-gutters slds-wrap slds-p-bottom_small">
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{resolutionsThisWeek}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            resolutions logged this week
          </div>
        </div>
      </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{articlesDrafted}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            articles drafted
          </div>
        </div>
      </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{articlesPending}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            awaiting human review
          </div>
        </div>
      </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{casesFlagged}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            related Cases flagged
          </div>
        </div>
      </lightning-card>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-5">
      <lightning-card>
        <div class="slds-p-around_medium slds-text-align_center">
          <div class="slds-text-heading_large">{escalations}</div>
          <div class="slds-text-body_small slds-text-color_weak">
            escalated, {escalationHint}
          </div>
        </div>
      </lightning-card>
    </div>
  </div>

  <template if:true={error}>
    <div class="slds-text-color_error slds-p-around_small" role="alert">
      {error}
    </div>
  </template>

  <div class="slds-grid slds-gutters slds-wrap">
    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small"
    >
      <lightning-card
        title="Top root causes, last 90 days"
        icon-name="standard:topic"
      >
        <template if:true={hasRootCauses}>
          <ul class="slds-has-dividers_bottom-space slds-p-horizontal_medium">
            <template for:each={topRootCauses} for:item="c">
              <li
                key={c.label}
                class="slds-item slds-grid slds-grid_align-spread"
              >
                <span>{c.label}</span>
                <span class="slds-badge">{c.count}</span>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasRootCauses}>
          <p class="slds-p-around_medium slds-text-color_weak">
            Nothing tagged yet.
          </p>
        </template>
      </lightning-card>
    </div>

    <div
      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small"
    >
      <lightning-card
        title="Most active technicians this week"
        icon-name="standard:user"
      >
        <template if:true={hasTechnicians}>
          <ul class="slds-has-dividers_bottom-space slds-p-horizontal_medium">
            <template for:each={topTechnicians} for:item="t">
              <li
                key={t.label}
                class="slds-item slds-grid slds-grid_align-spread"
              >
                <span>{t.label}</span>
                <span class="slds-badge">{t.count}</span>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasTechnicians}>
          <p class="slds-p-around_medium slds-text-color_weak">
            No activity this week yet.
          </p>
        </template>
      </lightning-card>
    </div>
  </div>

  <lightning-card
    title="Resolutions logged, last 7 days"
    icon-name="standard:metrics"
  >
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <template for:each={trend} for:item="t">
        <div
          key={t.key}
          class="slds-grid slds-grid_vertical-align-center slds-p-vertical_xxx-small"
        >
          <div
            class="slds-size_1-of-4 slds-text-body_small slds-text-color_weak"
          >
            {t.label}
          </div>
          <div
            class="slds-size_3-of-4 slds-grid slds-grid_vertical-align-center"
          >
            <div class="codify-bar" style={t.style}></div>
            <span class="slds-p-left_x-small slds-text-body_small"
              >{t.count}</span
            >
          </div>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
