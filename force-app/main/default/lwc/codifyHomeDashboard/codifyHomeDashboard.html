<template>
  <div class="codify-home">
    <header class="codify-hero">
      <p class="codify-hero__eyebrow">Codify</p>
      <h1 class="codify-hero__headline">{headline}</h1>
      <p class="codify-hero__sub">{subhead}</p>
    </header>

    <template if:true={error}>
      <div class="slds-text-color_error slds-p-around_small" role="alert">
        {error}
      </div>
    </template>

    <div class="codify-grid">
      <!-- Eight measures, one markup block. Successes and outstanding work sit
           in the same grid on purpose; both are equally the point. -->
      <template for:each={statCards} for:item="c">
        <section key={c.key} class="codify-card">
          <h2 class="codify-card__title">{c.title}</h2>
          <p class={c.valueClass}>{c.value}</p>
          <div class="codify-track">
            <div class={c.barClass} style={c.style}></div>
          </div>
          <p class="codify-card__meta">{c.meta}</p>
          <p class="codify-card__note">{c.note}</p>
        </section>
      </template>

      <section class="codify-card">
        <h2 class="codify-card__title">What keeps breaking</h2>
        <p class="codify-card__meta">Root causes, last 90 days.</p>
        <template if:true={hasRootCauses}>
          <ul class="codify-bars">
            <template for:each={rootCauseBars} for:item="b">
              <li key={b.label} class="codify-bars__row">
                <span class="codify-bars__label" title={b.label}
                  >{b.label}</span
                >
                <span class="codify-track">
                  <span
                    class="codify-bar codify-bar_drafted"
                    style={b.style}
                  ></span>
                </span>
                <span class="codify-bars__count">{b.count}</span>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasRootCauses}>
          <p class="codify-empty">Nothing tagged yet.</p>
        </template>
      </section>

      <section class="codify-card">
        <h2 class="codify-card__title">Who's capturing fixes</h2>
        <p class="codify-card__meta">Recaps logged this week.</p>
        <template if:true={hasTechnicians}>
          <ul class="codify-bars">
            <template for:each={technicianBars} for:item="b">
              <li key={b.label} class="codify-bars__row">
                <span class="codify-bars__label" title={b.label}
                  >{b.label}</span
                >
                <span class="codify-track">
                  <span
                    class="codify-bar codify-bar_tagged"
                    style={b.style}
                  ></span>
                </span>
                <span class="codify-bars__count">{b.count}</span>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasTechnicians}>
          <p class="codify-empty">No recaps logged this week.</p>
        </template>
      </section>

      <section class="codify-card">
        <h2 class="codify-card__title">What Codify did</h2>
        <p class="codify-card__meta">Audited actions this week, by type.</p>
        <template if:true={hasChangeTypes}>
          <ul class="codify-bars">
            <template for:each={changeTypeBars} for:item="b">
              <li key={b.label} class="codify-bars__row">
                <span class="codify-bars__label" title={b.label}
                  >{b.label}</span
                >
                <span class="codify-track">
                  <span
                    class="codify-bar codify-bar_published"
                    style={b.style}
                  ></span>
                </span>
                <span class="codify-bars__count">{b.count}</span>
              </li>
            </template>
          </ul>
        </template>
        <template if:false={hasChangeTypes}>
          <p class="codify-empty">Nothing recorded this week.</p>
        </template>
      </section>

      <section class="codify-card">
        <h2 class="codify-card__title">Capture cadence</h2>
        <p class="codify-card__meta">Fixes described, last 7 days.</p>
        <div class="codify-spark">
          <template for:each={trend} for:item="t">
            <div key={t.key} class="codify-spark__col" title={t.label}>
              <div class="codify-spark__fill" style={t.style}></div>
              <span class="codify-spark__count">{t.count}</span>
            </div>
          </template>
        </div>
      </section>
    </div>

    <template if:false={hasData}>
      <p class="codify-empty codify-empty_page">
        Nothing captured yet. These fill in as technicians describe fixes.
      </p>
    </template>
  </div>
</template>
